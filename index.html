<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 브레인스토밍 보드</title>
  <!-- 외부 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
  <!-- 외부 자바스크립트 연결 (ES 모듈 방식) -->
  <script type="module" src="main.js"></script>
</head>
<body>

<!-- 변경 전: value="💡 주제를 입력하세요" -->
<!-- 변경 후: -->
<header id="header">
    <!-- 우측 상단 TOP 3 버튼 -->
<button type="button" id="top3-btn" class="top3-btn">
  🔥 TOP 3
</button>

<!-- TOP 3 전용 모달 -->
<div id="top3-modal-overlay" class="modal-overlay">
  <div class="modal top3-modal">
    <div class="modal-title">🔥 실시간 인기 아이디어 TOP 3</div>
    <div id="top3-list" class="top3-list">
      <!-- JS에서 인기 순위 3개가 여기에 들어갑니다 -->
    </div>
  </div>
</div>
  <input type="text" id="topic-input" placeholder="💡 주제를 입력하세요" />
</header>
  <!-- 2. 중앙 아이디어 보드 -->
  <main id="board"></main>

  <!-- 3. 하단 작성 패널 -->
  <footer id="input-panel">
    <textarea id="idea-input" rows="1" placeholder="새 아이디어 작성... (Enter로 제출)"></textarea>
    <button id="submit-btn">등록</button>
  </footer>

  <!-- 4. 더블클릭 코멘트 모달 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-title" id="modal-idea-text"></div>
      <div class="comment-list" id="comment-list"></div>
      <div class="modal-input-group">
        <input type="text" class="modal-input" id="comment-input" placeholder="코멘트 입력...">
        <button class="vote-btn" id="comment-submit-btn">작성</button>
      </div>
    </div>
  </div>

</body>
</html>
